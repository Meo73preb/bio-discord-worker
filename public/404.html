<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#071015">
  <title>Không tìm thấy — Trà Mèo</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #071015; color: #e7f0ec; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 34rem); padding: clamp(28px, 7vw, 56px); border: 1px solid rgba(166,216,204,.25); border-radius: 20px; background: #0b181e; }
    p { color: #a6d8cc; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(3rem, 12vw, 5rem); font-weight: 500; line-height: 1; }
    .copy { color: #9aaead; line-height: 1.7; }
    a { display: inline-block; margin-top: 18px; padding: 10px 15px; border-radius: 999px; background: #a6d8cc; color: #071015; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #e7f0ec; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>404 · Lạc giữa làn sương</p>
    <h1>Không thấy<br>đường này.</h1>
    <div class="copy">Liên kết có thể đã cũ hoặc bị gõ nhầm. Nội dung chính vẫn ở trang hồ sơ.</div>
    <a href="/">Quay về bio</a>
  </main>
</body>
</html>
